upstream justina_openclaw {
    server justina-openclaw:18789;
}

upstream justina_app {
    server justina-app:8080;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Liveness for the proxy itself, so its health check does not depend on an upstream.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Justina's own health, useful from the host while debugging.
    location /health/ {
        proxy_pass http://justina_app;
        proxy_set_header Host $host;
    }

    # The tool API is internal: OpenClaw reaches it over the Docker network, never through the tunnel.
    # Returning 404 rather than 403 avoids advertising that the surface exists at all.
    location /tools/ {
        return 404;
    }

    # Everything else is channel traffic for the AI layer: webhooks and the control surface.
    location / {
        proxy_pass http://justina_openclaw;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The gateway uses WebSockets for its control plane.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
