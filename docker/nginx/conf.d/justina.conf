server {
    listen 80;
    # Alpine's resolver answers ::1 first for "localhost", so an IPv4-only listener makes the container
    # health check fail even though the proxy is working.
    listen [::]:80;
    server_name _;

    # Docker's embedded DNS. Named upstreams are resolved per request through the variables below, so
    # NGINX starts even when a backend is temporarily down. Without this, nginx refuses to start at all
    # if a single upstream host cannot be resolved at boot — one slow container would take the edge down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Liveness for the proxy itself, so its health check does not depend on an upstream.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Justina's own health, useful from the host while debugging.
    location /health/ {
        set $justina_app http://justina-app:8080;
        proxy_pass $justina_app$request_uri;
        proxy_set_header Host $host;
    }

    # The tool API is internal: OpenClaw reaches it over the Docker network, never through the tunnel.
    # Returning 404 rather than 403 avoids advertising that the surface exists at all.
    location /mcp {
        return 404;
    }

    location /tools/ {
        return 404;
    }

    # Everything else is channel traffic for the AI layer: webhooks and the control surface.
    location / {
        set $justina_openclaw http://justina-openclaw:18789;
        proxy_pass $justina_openclaw$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The gateway uses WebSockets for its control plane.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
