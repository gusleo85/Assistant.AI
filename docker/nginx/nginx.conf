user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log carries the correlation id so a request can be followed from the edge into the app (§40).
    log_format  justina  '$remote_addr - $status "$request" '
                         'bytes=$body_bytes_sent rt=$request_time '
                         'correlation=$http_x_correlation_id ua="$http_user_agent"';

    access_log  /var/log/nginx/access.log  justina;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Receipts arrive as images and PDFs; this mirrors the app's own limit so oversized uploads are
    # rejected at the edge instead of being buffered through the whole stack (§8).
    client_max_body_size 25m;
    client_body_timeout  60s;

    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    include /etc/nginx/conf.d/*.conf;
}
